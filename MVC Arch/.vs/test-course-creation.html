<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Course Creation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: red; font-size: 14px; }
        .success { color: green; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Test Course Creation Form</h1>
    <p>This is a test page to verify the course creation functionality.</p>
    
    <form id="testForm" method="post" action="/CourseManagement/Create">
        <div class="form-group">
            <label for="Title">Course Title *</label>
            <input type="text" id="Title" name="Title" required placeholder="Enter course title" />
        </div>
        
        <div class="form-group">
            <label for="Category">Category *</label>
            <select id="Category" name="Category" required>
                <option value="">Select Category</option>
                <option value="Programming">Programming</option>
                <option value="Design">Design</option>
                <option value="Business">Business</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="Description">Description *</label>
            <textarea id="Description" name="Description" required rows="4" placeholder="Enter course description"></textarea>
        </div>
        
        <div class="form-group">
            <label for="Price">Price ($) *</label>
            <input type="number" id="Price" name="Price" required step="0.01" min="0" placeholder="0.00" />
        </div>
        
        <div class="form-group">
            <label for="Duration">Duration (minutes) *</label>
            <input type="number" id="Duration" name="Duration" required min="1" placeholder="120" />
        </div>
        
        <div class="form-group">
            <label for="Difficulty">Difficulty *</label>
            <select id="Difficulty" name="Difficulty" required>
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>
        </div>
        
        <button type="submit">Create Test Course</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = '<p class="success">Form submitted! Check the browser console and network tab for details.</p>';
            
            // Log form data
            console.log('Form data being submitted:');
            for (let [key, value] of formData.entries()) {
                console.log(key + ': ' + value);
            }
            
            // Try to submit to the actual endpoint
            fetch('/CourseManagement/Create', {
                method: 'POST',
                body: formData,
                headers: {
                    'RequestVerificationToken': document.querySelector('input[name="__RequestVerificationToken"]')?.value || ''
                }
            })
            .then(response => {
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                return response.text();
            })
            .then(data => {
                console.log('Response data:', data);
                resultDiv.innerHTML += '<p class="success">Response received! Check console for details.</p>';
            })
            .catch(error => {
                console.error('Error:', error);
                resultDiv.innerHTML += '<p class="error">Error occurred: ' + error.message + '</p>';
            });
        });
        
        console.log('Test page loaded successfully');
    </script>
</body>
</html>
